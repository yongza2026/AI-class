<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Wall Plaster Gradient -->
    <linearGradient id="wallPlaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DFC9" />
      <stop offset="50%" stop-color="#DDD3BC" />
      <stop offset="100%" stop-color="#D0C5AA" />
    </linearGradient>

    <!-- Warm Ambient Spotlight -->
    <radialGradient id="warmLight1" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#E2B770" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#DDD3BC" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warmLight2" cx="75%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFE8BD" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D49F4B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B131F" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Navy Bar Finish -->
    <linearGradient id="navyCounter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1624" />
      <stop offset="40%" stop-color="#152238" />
      <stop offset="70%" stop-color="#111B2C" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- Stainless Steel Luster -->
    <linearGradient id="steelTrim" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A2AAB4" />
      <stop offset="25%" stop-color="#E1E7EE" />
      <stop offset="50%" stop-color="#7B838D" />
      <stop offset="75%" stop-color="#CFD6DE" />
      <stop offset="100%" stop-color="#555D66" />
    </linearGradient>

    <!-- Dark Walnut Wood -->
    <linearGradient id="walnutWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2B20" />
      <stop offset="50%" stop-color="#2B1F17" />
      <stop offset="100%" stop-color="#1D150F" />
    </linearGradient>

    <!-- Dark Vignette Floor -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202A" />
      <stop offset="60%" stop-color="#0F141B" />
      <stop offset="100%" stop-color="#070A0F" />
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="1600" height="700" fill="url(#wallPlaster)" />
  <rect width="1600" height="700" fill="url(#warmLight1)" />

  <!-- Bauhaus Architectural Wall Reliefs (Asymmetrical) -->
  <!-- Vermilion Circle Niche -->
  <circle cx="360" cy="300" r="140" fill="#E43D30" />
  <circle cx="360" cy="300" r="140" fill="url(#warmLight1)" opacity="0.4" />
  <!-- Cobalt Semicircle Arch -->
  <path d="M 520,380 A 110,110 0 0,0 740,380 Z" fill="#2447C6" opacity="0.9" />
  <!-- Bauhaus Brass Rod Line Accent -->
  <line x1="200" y1="200" x2="880" y2="200" stroke="#F3C638" stroke-width="3" opacity="0.8" />
  <line x1="360" y1="120" x2="360" y2="460" stroke="#111C2D" stroke-width="2" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Floor Level -->
  <polygon points="0,620 1600,540 1600,1000 0,1000" fill="url(#floorGrad)" />

  <!-- Subtle Perspective Floor Tiles -->
  <line x1="300" y1="605" x2="0" y2="950" stroke="#232C3A" stroke-width="1.5" />
  <line x1="600" y1="590" x2="400" y2="1000" stroke="#232C3A" stroke-width="1.5" />
  <line x1="900" y1="575" x2="900" y2="1000" stroke="#232C3A" stroke-width="1.5" />
  <line x1="1200" y1="560" x2="1400" y2="1000" stroke="#232C3A" stroke-width="1.5" />

  <!-- Back Bar Stainless & Wood Shelf Wall -->
  <rect x="940" y="160" width="600" height="420" fill="url(#walnutWood)" />
  <rect x="920" y="240" width="640" height="12" fill="url(#steelTrim)" />
  <rect x="920" y="340" width="640" height="12" fill="url(#steelTrim)" />
  <rect x="920" y="440" width="640" height="12" fill="url(#steelTrim)" />

  <!-- Glassware & Decanter Silhouettes on Shelves -->
  <g fill="#FFFFFF" opacity="0.25">
    <rect x="960" y="195" width="28" height="45" rx="3" />
    <rect x="1000" y="180" width="35" height="60" rx="4" />
    <path d="M1060,240 L1080,200 L1090,200 L1110,240 Z" />
    <circle cx="1160" cy="220" r="16" />
    <rect x="1220" y="190" width="40" height="50" rx="6" />
    <!-- Row 2 -->
    <rect x="980" y="295" width="30" height="45" rx="2" />
    <rect x="1030" y="280" width="32" height="60" rx="4" />
    <path d="M1100,340 L1115,305 L1125,305 L1140,340 Z" />
    <rect x="1170" y="290" width="45" height="50" rx="3" />
  </g>

  <!-- Deep Navy Bar Counter (Angular Perspective) -->
  <polygon points="120,620 950,560 1020,950 0,950" fill="url(#navyCounter)" />
  <!-- Stainless Counter Trim -->
  <polygon points="110,615 955,555 960,565 115,625" fill="url(#steelTrim)" />

  <!-- Bar Stools for Solo Drinkers -->
  <!-- Stool 1 -->
  <g>
    <ellipse cx="260" cy="730" rx="46" ry="14" fill="#2B1F17" />
    <line x1="240" y1="738" x2="210" y2="920" stroke="#7B838D" stroke-width="6" />
    <line x1="280" y1="738" x2="310" y2="920" stroke="#7B838D" stroke-width="6" />
    <line x1="260" y1="740" x2="260" y2="920" stroke="#555D66" stroke-width="5" />
    <ellipse cx="260" cy="728" rx="44" ry="12" fill="#3D2C20" />
    <ellipse cx="260" cy="726" rx="40" ry="10" fill="#E43D30" opacity="0.85" />
  </g>

  <!-- Stool 2 -->
  <g>
    <ellipse cx="480" cy="700" rx="44" ry="13" fill="#2B1F17" />
    <line x1="460" y1="708" x2="435" y2="880" stroke="#7B838D" stroke-width="5.5" />
    <line x1="500" y1="708" x2="525" y2="880" stroke="#7B838D" stroke-width="5.5" />
    <line x1="480" y1="710" x2="480" y2="880" stroke="#555D66" stroke-width="4.5" />
    <ellipse cx="480" cy="698" rx="42" ry="11" fill="#3D2C20" />
    <ellipse cx="480" cy="696" rx="38" ry="9" fill="#111C2D" />
  </g>

  <!-- Stool 3 -->
  <g>
    <ellipse cx="680" cy="670" rx="40" ry="12" fill="#2B1F17" />
    <line x1="662" y1="676" x2="640" y2="840" stroke="#7B838D" stroke-width="5" />
    <line x1="698" y1="676" x2="720" y2="840" stroke="#7B838D" stroke-width="5" />
    <line x1="680" y1="678" x2="680" y2="840" stroke="#555D66" stroke-width="4" />
    <ellipse cx="680" cy="668" rx="38" ry="10" fill="#3D2C20" />
    <ellipse cx="680" cy="666" rx="35" ry="8" fill="#2447C6" opacity="0.9" />
  </g>

  <!-- Intimate Table for Two (Right Side) -->
  <g>
    <ellipse cx="1280" cy="780" rx="140" ry="42" fill="#2B1F17" />
    <ellipse cx="1280" cy="775" rx="136" ry="38" fill="#152238" />
    <path d="M1280,780 L1270,980 L1290,980 Z" fill="#555D66" />
    <!-- Two low modern timber chairs -->
    <path d="M1110,740 Q1110,670 1170,680 L1180,780 Z" fill="#3D2C20" opacity="0.9" />
    <path d="M1450,740 Q1450,670 1390,680 L1380,780 Z" fill="#3D2C20" opacity="0.9" />
  </g>

  <!-- Warm Pendant Downlights -->
  <!-- Lamp 1 -->
  <line x1="380" y1="0" x2="380" y2="280" stroke="#111C2D" stroke-width="2.5" />
  <path d="M355,280 L405,280 L395,310 L365,310 Z" fill="#111C2D" />
  <circle cx="380" cy="312" r="7" fill="#F3C638" />
  <polygon points="360,315 400,315 540,680 220,680" fill="url(#warmLight1)" opacity="0.35" />

  <!-- Lamp 2 -->
  <line x1="1280" y1="0" x2="1280" y2="420" stroke="#111C2D" stroke-width="2.5" />
  <path d="M1240,420 L1320,420 L1305,465 L1255,465 Z" fill="#111C2D" />
  <circle cx="1280" cy="468" r="10" fill="#F3C638" />
  <polygon points="1250,470 1310,470 1480,820 1080,820" fill="url(#warmLight2)" opacity="0.45" />

  <!-- Cinematic Low-Light Vignette Overlay -->
  <rect width="1600" height="1000" fill="url(#floorGrad)" opacity="0.22" />
</svg>
